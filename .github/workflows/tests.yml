name: Tests

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  tests:
    name: "PHPUnit – PHP ${{ matrix.php }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # PHPUnit 11 čte atributy #[DataProvider]
          - { php: '8.5', phpunit: '^11.5', config: 'phpunit.xml.dist' }
          - { php: '8.4', phpunit: '^11.5', config: 'phpunit.xml.dist' }
          - { php: '8.3', phpunit: '^11.5', config: 'phpunit.xml.dist' }
          - { php: '8.2', phpunit: '^11.5', config: 'phpunit.xml.dist' }
          # PHPUnit 10 ještě čte atributy, běží od PHP 8.1
          - { php: '8.1', phpunit: '^10.5', config: 'phpunit.legacy.xml.dist' }
          # PHPUnit 9 atributy neumí – jedou @dataProvider anotace
          - { php: '8.0', phpunit: '^9.6',  config: 'phpunit.legacy.xml.dist' }
          - { php: '7.4', phpunit: '^9.6',  config: 'phpunit.legacy.xml.dist' }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Vybrat verzi PHPUnit pro tuto PHP
        run: |
          composer remove --dev --no-update \
            phpunit/phpunit \
            phpstan/phpstan \
            spaze/phpstan-disallowed-calls \
            slevomat/coding-standard \
            rector/rector
          composer require --dev --no-update "phpunit/phpunit:${{ matrix.phpunit }}"

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress

      - name: Prepare working directories
        run: mkdir -p temp/cache log

      - name: Run PHPUnit
        run: vendor/bin/phpunit --configuration ${{ matrix.config }}

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=512M --no-progress

  phpcs:
    name: Coding standard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Prepare working directories
        run: mkdir -p temp

      - name: Run PHPCS
        run: vendor/bin/phpcs
